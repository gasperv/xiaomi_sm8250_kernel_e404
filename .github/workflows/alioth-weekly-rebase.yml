name: alioth weekly rebase

# Every Monday: for each of our kernel branches, check whether kvsnr113's
# staging-bpf moved and, if so, rebase and build it (see alioth-rebase.yml).
# Each branch needs a tag base-<branch> on the upstream commit it sits on.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      branch:
        description: One branch only (default all tracked branches)
        default: ""
      force:
        description: Rebuild even if this upstream commit was already handled
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rebase:
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(inputs.branch && format('["{0}"]', inputs.branch) || '["alioth-next2", "alioth-susfs23"]') }}
    uses: ./.github/workflows/alioth-rebase.yml
    with:
      branch: ${{ matrix.branch }}
      force: ${{ inputs.force || false }}
